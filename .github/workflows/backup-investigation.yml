name: Backup investigation platform

# Ежедневная резервная копия базы расследований и тома с оригиналами источников.
# Копия проверяется восстановлением: непроверенная копия не считается копией.

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC — 05:30 по Москве, вне рабочего окна.
    - cron: '30 2 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: '188.116.23.111'
      SSH_PASSWORD: ${{ secrets.N8N_SSH_ROOT_PASSWORD }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_USER: deploy
      POSTGRES_PASSWORD: ${{ secrets.INVESTIGATION_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet paramiko
      - name: Снять и проверить резервную копию
        run: python3 investigation/deploy/backup.py
